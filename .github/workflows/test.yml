name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind zlib1g-dev

      - name: Build and test
        run: make test

      - name: Test with sanitizers
        run: make test SAN=1

      - name: Test under valgrind
        run: make test-valgrind

  test-gcc14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test under GCC 14
        run: >
          docker run --rm -v "$PWD":/w -w /w gcc:14
          sh -c 'apt-get update && apt-get install -y -qq libssl-dev zlib1g-dev && make test'
